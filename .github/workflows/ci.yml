name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip and install package with locked dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt

      - name: Run Ruff format check
        run: python -m ruff format --check .

      - name: Run Ruff linter
        run: python -m ruff check .

      - name: Run mypy type checker
        run: python -m mypy src tests

      - name: Run pytest
        run: python -m pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Cloudflare Worker dependencies
        run: npm --prefix cloudflare ci

      - name: Worker syntax typecheck
        run: npm --prefix cloudflare run typecheck

      - name: Worker Node test suite (ledger, worker, cross-language receipt integrity)
        run: npm --prefix cloudflare run test:node
