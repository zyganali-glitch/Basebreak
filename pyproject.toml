[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "basebreak"
version = "0.1.0"
description = "Causal verification runtime for AI-written software changes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Mehmet Aydogan" },
]
dependencies = []

[project.scripts]
basebreak = "basebreak.cli.main:main"

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "python-dotenv==1.2.4",
    "ruff==0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/basebreak"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--ignore=tests/fixtures"]
markers = [
    "live: live integration tests requiring external provider credentials and network",
]
